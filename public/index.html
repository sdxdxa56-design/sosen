<!-- language: HTML, file: public/index.html -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>مشاركة الموقع والصورة</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f4f5f7; }
    main { width: min(92vw, 520px); box-sizing: border-box; padding: 28px; border: 1px solid #343b4a; border-radius: 18px; background: #191f2b; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { line-height: 1.8; color: #c8ced9; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 14px; margin-top: 12px; background: #6d7cff; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    video { width: 100%; margin-top: 14px; border-radius: 12px; background: #080a0f; }
    #status { min-height: 2em; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>مشاركة صورة وموقعك</h1>
    <p>اضغط أدناه للسماح بالوصول إلى الكاميرا الأمامية وتحديد الموقع للمتابعة.</p>
    <button id="start">موافقة والمتابعة</button>
    <video id="preview" autoplay playsinline muted hidden></video>
    <button id="capture" hidden>التقاط الصورة ومشاركة الموقع</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
